name: Construir y publicar tablero
on:
  push:
    paths:
      - 'Proyecto_Auto_Vercel/data/**'
      - 'Proyecto_Auto_Vercel/web/**'
      - 'Proyecto_Auto_Vercel/pipeline/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install -r Proyecto_Auto_Vercel/requirements.txt
      - name: Construir index.html
        run: python Proyecto_Auto_Vercel/pipeline/build.py
      - name: Publicar index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Proyecto_Auto_Vercel/index.html
          git diff --staged --quiet || git commit -m "Auto: regenerar tablero [skip ci]"
          git push
